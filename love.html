<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>عيد ميلاد بروتي</title>

<style>
body {
    background: linear-gradient(135deg, #460000, #460000);
    font-family: Arial;
    text-align: center;
    padding: 40px;
}

.box {
    background: rgb(250, 169, 169);
    padding: 25px;
    border-radius: 20px;
    max-width: 400px;
    margin: auto;
}
</style>

</head>

<body>



<div class="box">
    <h2>💖 إلى غزالتي💖</h2>

    <p>
        كل عام وانتي بخير وعيونك بخير
        <br>وعيون قلبي في غرامك ساهية
        <br>
        <br>كل عام وانت في عالمي انسان غير
        <br>كل عام وانت في قلبي اكبر طاغية
        <br>
        <h4>بو معتق</h4>
    </p>
    <img src="./Broty.jpg" class="love-img">
    <style>.love-img {
    width: 100%;
    max-width: 300px;
    border-radius: 20px;
    margin-top: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    opacity: 0;
    animation: fadeIn 2s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}
</style>
</div>

</body>
</html>
